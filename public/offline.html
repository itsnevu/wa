<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Offline</title>
<style>
:root { --page:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --text:#111827; --muted:#606775; --accent:#7c3aed; --accent-h:#6d28d9; --r:10px; }
* { box-sizing:border-box; }
body { background:var(--page); color:var(--text); font:13.5px/1.5 system-ui; margin:0; min-height:100dvh; display:grid; place-items:center; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:24px; width:320px; max-width:100%; text-align:center; display:grid; gap:12px; justify-items:center; }
h1 { font-size:15px; margin:0; }
p { margin:0; color:var(--muted); font-size:12px; }
button { font:inherit; font-weight:600; background:var(--accent); border:1px solid var(--accent); color:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; }
button:hover { background:var(--accent-h); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main class="card">
  <h1>kamu sedang offline</h1>
  <p>Periksa koneksi lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">coba lagi</button>
</main>
</body>
</html>
