name: Tenant route inventory
on: [push, pull_request]
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce the SQLite driver boundary
        run: node scripts/check-sqlite-driver-boundary.mjs
      - name: Enforce route scope and monotonic pending baseline
        run: npm run test:tenant:routes
        env:
          INVENTORY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Verify session rotation and tenant status contracts
        run: npm run test:tenant:t03
      - name: Verify chat message transaction and query plan
        run: node --test tests/database-transactions.test.mjs tests/chat-message-read.test.mjs tests/user-provisioning.test.mjs tests/number-membership-migration.test.mjs tests/number-owner-assignment.test.mjs
      - name: Verify provisioned agent access to inbox and media
        env:
          ALLOW_AUTO_MIGRATE: '1'
          MULTITENANT_ENABLED: '0'
          MEDIA_TEST_BROWSER: /usr/bin/google-chrome
        run: |
          node --regexp-interpret-all scripts/verify-phase4.mjs
          node --regexp-interpret-all scripts/verify-media-browser.mjs
