name: Tenant route inventory
on: [push, pull_request]
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce route scope and monotonic pending baseline
        run: npm run test:tenant:routes
        env:
          INVENTORY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Verify session rotation and tenant status contracts
        run: npm run test:tenant:t03
